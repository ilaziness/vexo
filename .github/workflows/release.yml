name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Linux dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libgtk-4-dev \
            libwebkitgtk-6.0-dev \
            libwayland-dev \
            build-essential \
            pkg-config

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: latest
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Task and Wails CLI
        run: |
          go install github.com/go-task/task/v3/cmd/task@latest
          go install github.com/wailsapp/wails/v3/cmd/wails3@latest

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Build Linux
        run: make build-linux VERSION=${{ github.ref_name }} MODE=release

      - name: Archive Linux package
        run: |
          test -f bin/Vexo
          tar -C bin -czf bin/Vexo_${{ github.ref_name }}_linux_amd64.tar.gz Vexo

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v6
        with:
          name: linux-amd64
          path: bin/Vexo_${{ github.ref_name }}_linux_amd64.tar.gz
          if-no-files-found: error

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: latest
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Task and Wails CLI
        run: |
          go install github.com/go-task/task/v3/cmd/task@latest
          go install github.com/wailsapp/wails/v3/cmd/wails3@latest

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      # Avoid chocolatey make + SHELL="$$BASH" ($$ expands to PID under bash).
      # Drive the same steps as Makefile build-windows via Git Bash.
      - name: Build Windows
        env:
          VERSION: ${{ github.ref_name }}
          MODE: release
          CONFIG_FILE: internal/buildinfo/buildinfo.go
        run: |
          set -euo pipefail
          cp "$CONFIG_FILE" "$CONFIG_FILE.bak"
          GIT_INFO="$(git rev-parse HEAD 2>/dev/null || echo unknown)"
          BUILD_TIME="$(date -Iseconds 2>/dev/null || date "+%Y-%m-%dT%H:%M:%S%z" 2>/dev/null || echo unknown)"
          sed -i "s/Mode      = \"debug\"/Mode      = \"$MODE\"/" "$CONFIG_FILE"
          sed -i "s/Version   = \"v1.0.0\"/Version   = \"$VERSION\"/" "$CONFIG_FILE"
          sed -i "s|GitInfo   = \".*\"|GitInfo   = \"$GIT_INFO\"|" "$CONFIG_FILE"
          sed -i "s|BuildTime = \".*\"|BuildTime = \"$BUILD_TIME\"|" "$CONFIG_FILE"
          status=0
          wails3 build GOOS=windows VERSION="$VERSION" MODE="$MODE" || status=$?
          mv "$CONFIG_FILE.bak" "$CONFIG_FILE"
          exit $status

      - name: Archive Windows package
        shell: pwsh
        run: |
          if (-not (Test-Path bin/Vexo.exe)) { throw "missing bin/Vexo.exe" }
          Compress-Archive -Path bin/Vexo.exe -DestinationPath "bin/Vexo_${{ github.ref_name }}_windows_amd64.zip" -Force

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v6
        with:
          name: windows-amd64
          path: bin/Vexo_${{ github.ref_name }}_windows_amd64.zip
          if-no-files-found: error

  release:
    name: Draft Release
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/Vexo_${{ github.ref_name }}_linux_amd64.tar.gz
            dist/Vexo_${{ github.ref_name }}_windows_amd64.zip
