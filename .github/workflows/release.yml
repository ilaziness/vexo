name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libgtk-4-dev \
            libwebkitgtk-6.0-dev \
            libwayland-dev \
            build-essential \
            pkg-config

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: latest
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Task and Wails CLI
        run: |
          go install github.com/go-task/task/v3/cmd/task@latest
          go install github.com/wailsapp/wails/v3/cmd/wails3@latest

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Build Linux
        run: make build-linux VERSION=${{ github.ref_name }} MODE=release

      - name: Archive Linux package
        run: |
          test -f bin/Vexo
          tar -C bin -czf bin/Vexo_${{ github.ref_name }}_linux_amd64.tar.gz Vexo

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-amd64
          path: bin/Vexo_${{ github.ref_name }}_linux_amd64.tar.gz
          if-no-files-found: error

  # Cross-compile Windows from Linux (CGO_ENABLED=0). Avoids Windows runner + make/SHELL issues.
  build-windows:
    name: Build Windows
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install zip and make
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends zip make

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: latest
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Task and Wails CLI
        run: |
          go install github.com/go-task/task/v3/cmd/task@latest
          go install github.com/wailsapp/wails/v3/cmd/wails3@latest

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Build Windows (cross-compile)
        run: make build-windows VERSION=${{ github.ref_name }} MODE=release

      - name: Archive Windows package
        run: |
          test -f bin/Vexo.exe
          rm -f bin/Vexo_${{ github.ref_name }}_windows_amd64.zip
          (cd bin && zip -q Vexo_${{ github.ref_name }}_windows_amd64.zip Vexo.exe)

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-amd64
          path: bin/Vexo_${{ github.ref_name }}_windows_amd64.zip
          if-no-files-found: error

  release:
    name: Draft Release
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/Vexo_${{ github.ref_name }}_linux_amd64.tar.gz
            dist/Vexo_${{ github.ref_name }}_windows_amd64.zip
